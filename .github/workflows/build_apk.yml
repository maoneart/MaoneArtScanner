name: Build MaoneArt Scanner APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArtScanner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: 'MaoneArt Scanner v1.0.0 (Release)'
          body: |
            ## 📄 MaoneArt Scanner & AI OCR - Android Release APK
            
            Aplikasi Scanner Dokumen Pintar berbasis Flutter dengan deteksi kertas otomatis, auto-crop, perspektif transformasi, ekstraksi teks OCR offline, dan ekspor multi-page PDF!
            
            ### ✨ Fitur Unggulan:
            - 📑 **Auto Paper Detection & Auto-Crop**: Deteksi tepi kertas otomatis secara presisi menggunakan Google ML Kit Document Scanner Engine.
            - 🔍 **AI OCR Engine (Offline & Fast)**: Ekstraksi teks dari kertas & dokumen fisik dalam hitungan detik tanpa perlu koneksi internet.
            - 🎨 **Glassmorphism Dark Theme UI**: Tampilan modern, bersih, mewah dengan efek frosted glass dan animasi halus.
            - 📄 **Multi-Page & PDF Export**: Gabungkan banyak halaman scan menjadi 1 berkas PDF rapi siap cetak/bagikan.
            - 📋 **Pencarian & Salin Teks OCR**: Highlight teks yang dicari dan salin ke clipboard dengan 1 sentuhan.
            - 🛡️ **Penyimpanan Lokal Aman**: Dokumen tersimpan rapi di perangkat dengan sistem tag/kategori (Dokumen, Struk/Nota, KTP/ID, Sertifikat, Catatan).
            
            📥 **Download file `app-release.apk` di bawah ini dan instal langsung di smartphone Android Anda!**
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
