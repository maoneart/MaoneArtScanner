name: Build MaoneArt Scanner APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons:main

      - name: Build Universal Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=CAPSOLVER_API_KEY=${{ secrets.CAPSOLVER_API_KEY }}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArtScanner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.5
          name: 'MaoneArt Scanner v1.1.5 (Release)'
          body: |
            ## 📄 MaoneArt Scanner & AI OCR - Android Release APK (v1.1.5)
            
            - **Perbaikan Sinkronisasi Bulan & Tahun STNK 5 Tahunan (TNKB)**: Memisahkan secara presisi antara tanggal jatuh tempo Pajak PKB tahunan (misal 28 April) dengan masa berlaku Plat Kaleng 5 Tahunan (misal `04.30` / April 2030) agar 100% cocok dengan plat fisik kendaraan.
            - **Pemetaan Presisi Plat B Wilayah Jawa Barat**: Mendeteksi akurat seluruh plat B Jawa Barat untuk Kota Bekasi (akhiran `K`), Kabupaten Bekasi / Cikarang (akhiran `F`), dan Kota Depok / Cinere (akhiran `Z` & `E`).
            - **Live Samsat Gateway Terintegrasi**: Penarikan data real-time resmi tanpa captcha solver tambahan untuk Jawa Barat, Banten, dan DI Yogyakarta.
            
            Aplikasi Scanner Dokumen Pintar berbasis Flutter dengan deteksi kertas otomatis, auto-crop, perspektif transformasi, ekstraksi teks OCR offline, dan ekspor multi-page PDF!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
