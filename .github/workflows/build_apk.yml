name: Build MaoneArt Scanner APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons:main

      - name: Build Universal Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArtScanner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.1
          name: 'MaoneArt Scanner v1.1.1 (Release)'
          body: |
            ## 📄 MaoneArt Scanner & AI OCR - Android Release APK (v1.1.1)
            
            - **Desain Baru Scanner FAB (Duo Action Capsule Pill)**: Tombol pemindai kamera dan impor galeri dirancang menjadi kapsul pill biru modern yang ringkas dan elegan sesuai referensi desain pengguna.
            - **Popup Menu Titik 3 Header Rapi**: Memindahkan menu Cek Pajak Kendaraan dan Informasi Aplikasi ke dalam Popup Menu (titik 3) di AppBar atas agar tampilan header semakin bersih dan profesional.
            
            Aplikasi Scanner Dokumen Pintar berbasis Flutter dengan deteksi kertas otomatis, auto-crop, perspektif transformasi, ekstraksi teks OCR offline, dan ekspor multi-page PDF!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
