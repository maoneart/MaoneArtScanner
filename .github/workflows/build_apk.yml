name: Build MaoneArt Scanner APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=CAPSOLVER_API_KEY=${{ secrets.CAPSOLVER_API_KEY }}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArtScanner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "raw_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: ${{ steps.app_version.outputs.version }}
          name: 'MaoneArt Scanner ${{ steps.app_version.outputs.version }} (Permanent Release Key & PDF Suite)'
          body: |
            ## 📄 MaoneArt Scanner ${{ steps.app_version.outputs.version }} — Precision Cropper & PDF Tools Suite

            ### 🔑 Permanent Release Keystore Signature
            - Ditandatangani dengan keystore resmi permanen MaoneArt (`release.jks`, masa berlaku hingga 2054).
            - Update berikutnya dapat langsung ditimpa (*in-place update*) tanpa konflik tanda tangan (*signature mismatch*).

            ### ✂️ 1. Precision Document Crop & Straightener Editor
            - **Interactive 8-Point Touch Handles**: Pemotong dokumen presisi dengan grid rule-of-thirds dan touch-draggable box.
            - **Fine Degree Angle Straightener**: Slider pelurus sudut halus (-30.0° s/d +30.0°) untuk memperbaiki dokumen atau struk yang miring saat difoto.
            - **Preset Aspect Ratio Cepat**: Mendukung A4 (1:1.414), KTP / ID Card (85.6 : 54), Persegi 1:1, 4:3, 16:9, dan Bebas (Freeform).
            - **Pixel-Perfect Baking**: Memperbaiki orientasi EXIF dan merender ulang piksel JPEG kualitas tinggi (95%).

            ### 📑 2. Full PDF Tools Suite Terintegrasi
            - **Baca PDF (In-App PDF Viewer)**: Buka file PDF dari memori HP dengan dukungan pinch-to-zoom, sharing, dan pencetakan langsung.
            - **Kompres PDF**: 3 pilihan kompresi (Ringan, Standar, Maksimal) dengan laporan penghematan ukuran file.
            - **Pisah PDF (Split)**: Pemisahan halaman dokumen fleksibel (Pilih Semua, Ganjil, Genap, atau Halaman Kustom).
            - **Gabung PDF (Merge)**: Penggabungan multi-file PDF menjadi 1 file utuh dengan urutan reorderable drag-and-drop.

            ### 🎨 3. Redesign Total ke SHADCN UI (Zinc Theme)
            - Mengganti seluruh efek glassmorphic blur berat menjadi arsitektur Shadcn UI minimalis (`#09090B` Zinc Dark).
            - Border solid 1px `#27272A`, tipografi tajam *Plus Jakarta Sans* & *JetBrains Mono*, dock bar jempol ergonomis, dan MaoneArt Symmetrical Modal 2-kolom.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
