name: Build MaoneArt Scanner APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons:main

      - name: Build Universal Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArtScanner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.0
          name: 'MaoneArt Scanner v1.1.0 (Release)'
          body: |
            ## 📄 MaoneArt Scanner & AI OCR - Android Release APK (v1.1.0)
            
            - **Desain Baru Scanner FAB (Glassmorphic Floating Cyber Dock)**: Antarmuka tombol Scan Dokumen dan Impor Galeri baru yang jauh lebih keren, modern, bercahaya neon, dan beranimasi mikro elegan.
            - **Antarmuka Cek Pajak Bersih & 100% Otomatis**: Menghapus tombol manual pilihan motor/mobil dan tipe kendaraan karena sistem sudah 100% otomatis mengambil data asli server e-Samsat.
            - **Hidden Mode Shortcut Pajak Kendaraan**: Banner besar di beranda dihilangkan untuk ruang daftar dokumen yang lega, menu Cek Pajak kini diakses melalui ikon mobil elegan di AppBar atas.
            
            Aplikasi Scanner Dokumen Pintar berbasis Flutter dengan deteksi kertas otomatis, auto-crop, perspektif transformasi, ekstraksi teks OCR offline, dan ekspor multi-page PDF!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
