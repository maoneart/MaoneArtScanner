name: maoneart_scanner
description: "MaoneArt Scanner - Smart AI Document Scanner with Auto Paper Detection, Crop, OCR & PDF Export"
publish_to: 'none'
version: 1.0.7+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Google ML Kit Scanner & OCR
  google_mlkit_document_scanner: ^0.4.0
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_commons: ^0.9.0

  # Camera & Gallery Fallback
  image_picker: ^1.1.2
  image: ^4.2.0

  # PDF Generation & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # File & Storage
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.0
  open_filex: ^4.5.0
  url_launcher: ^6.3.1

  # UI & Design System
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_spinkit: ^5.2.1
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
